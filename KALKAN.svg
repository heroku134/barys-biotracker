<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2150 780" width="215mm" height="78mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
      .font-sans { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .title-kalkan { font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: 14px; }
      .sub-sport { font-family: 'Montserrat', sans-serif; font-weight: 800; letter-spacing: 20px; }
      .tag-saat { font-family: 'JetBrains Mono', monospace; font-weight: 800; letter-spacing: 3px; }
    </style>

    <!-- Deep Space Obsidian Carbon Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Signature Cyber Mint Neon Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="60%" stop-color="#00E575" />
      <stop offset="100%" stop-color="#00B050" />
    </linearGradient>

    <!-- Brushed Surgical Titanium Silver -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F1F5F9" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Dark Ballistic Composite Armor -->
    <linearGradient id="armor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="kalkan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Dimensional Armor Depth -->
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- ================================================================ -->
    <!-- 100% PURE MATHEMATICAL VECTOR LOGO: KALKAN STEALTH APEX SHIELD   -->
    <!-- (ZERO RASTER BITMAPS, INFINITELY SHARP AT ANY SCALE / CNC)       -->
    <!-- ================================================================ -->
    <g id="kalkan-stealth-shield">
      <!-- Outer Defensive Aura Frame (Shadow/Accent) -->
      <polygon points="50,20 120,5 240,40 180,120 240,200 120,235 50,220" fill="none" stroke="#00FFA3" stroke-width="1.5" stroke-opacity="0.25" />

      <!-- Left Flank: Massive Titanium Armor Plate (Left side of Shield & Backbone of 'K') -->
      <path d="M 60,30 L 122,12 L 122,228 L 60,185 L 52,110 Z" fill="url(#metal-grad)" filter="url(#shadow-filter)" />
      <!-- Beveled Inner Chiseled Edge -->
      <path d="M 122,12 L 122,228 L 98,206 L 98,34 Z" fill="#000000" opacity="0.32" />
      <!-- Tactical Precision Bore Indicator -->
      <circle cx="85" cy="120" r="3.5" fill="#00FFA3" />

      <!-- Upper Kinetic Blade (Upper arm of 'K' & Top Shield Deflector) -->
      <path d="M 144,20 L 238,52 L 182,118 L 144,118 Z" fill="url(#neon-grad)" filter="url(#kalkan-glow)" />

      <!-- Lower Kinetic Spearhead (Lower arm of 'K' & Bottom Shield Apex) -->
      <path d="M 144,134 L 208,134 L 144,244 Z" fill="url(#neon-grad)" />

      <!-- Interlocking Ballistic Titanium Wing (Completes the Shield Crest) -->
      <path d="M 215,134 L 250,90 L 250,158 L 156,254 L 144,244 Z" fill="url(#metal-grad)" />

      <!-- Central Laser-Etched Slit Light (Energy Core / Heart Pulse) -->
      <line x1="133" y1="28" x2="133" y2="230" stroke="#00FFA3" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8" />
    </g>

    <!-- Complete Brand Signature Unit -->
    <g id="kalkan-sport-brand">
      <!-- 1. The Aggressive Emblem -->
      <use href="#kalkan-stealth-shield" />

      <!-- 2. Typography: Primary Wordmark «КАЛКАН» -->
      <text x="320" y="112" class="title-kalkan" font-size="94" fill="#FFFFFF">КАЛКАН</text>
      
      <!-- 3. Typography: Secondary Sport Descriptor «С П О Р Т» -->
      <text x="328" y="178" class="sub-sport" font-size="34" fill="#00FFA3">СПОРТ</text>

      <!-- 4. Tactical Divider Line -->
      <line x1="324" y1="202" x2="940" y2="202" stroke="#1E293B" stroke-width="2" />

      <!-- 5. Watch Identification Badge «СААТ-1» -->
      <g transform="translate(324, 218)">
        <rect width="138" height="34" rx="8" fill="#0A121E" stroke="#00FFA3" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="16" cy="17" r="4" fill="#00FFA3" />
        <text x="28" y="23" class="tag-saat" font-size="15" fill="#FFFFFF">СААТ-1</text>

        <text x="156" y="23" class="font-mono" font-size="13" font-weight="700" fill="#64748B" letter-spacing="2">TITANIUM MULTISPORT WATCH · 100M WATER RESIST</text>
      </g>
    </g>
  </defs>

  <!-- Base Matte Obsidian Background -->
  <rect width="2150" height="780" fill="url(#bg-grad)" />

  <!-- Technical Engineering Grid Details (Subtle 3% Opacity) -->
  <g opacity="0.04" stroke="#00FFA3" stroke-width="1.5">
    <circle cx="1075" cy="390" r="300" fill="none" />
    <circle cx="1075" cy="390" r="320" fill="none" stroke-dasharray="6 8" />
    <line x1="100" y1="390" x2="2050" y2="390" />
    <line x1="1075" y1="60" x2="1075" y2="720" />
  </g>

  <!-- Outer Precision Boundary Marks (Watchmaker Bezel Coordinates) -->
  <g opacity="0.3" stroke="#94A3B8" stroke-width="1.5">
    <!-- Top-Left Corner Bracket -->
    <path d="M 40,70 L 40,40 L 70,40" fill="none" />
    <!-- Top-Right Corner Bracket -->
    <path d="M 2110,40 L 2080,40 M 2110,40 L 2110,70" fill="none" />
    <!-- Bottom-Left Corner Bracket -->
    <path d="M 40,710 L 40,740 L 70,740" fill="none" />
    <!-- Bottom-Right Corner Bracket -->
    <path d="M 2110,740 L 2080,740 M 2110,740 L 2110,710" fill="none" />
  </g>

  <!-- Center Aggressive Brand Logo Unit -->
  <g transform="translate(600, 260) scale(1.0)">
    <use href="#kalkan-sport-brand" />
  </g>

  <!-- Bottom Technical Engineering Footnote -->
  <g transform="translate(60, 745)">
    <text class="font-mono" font-size="12" fill="#475569" letter-spacing="2">
      KALKAN DEFENSE TECH · HARDWARE CALIBRE: СААТ-1 · DESIGNED FOR CENTRAL ASIAN ATHLETES · ALMATY / BISHKEK
    </text>
  </g>
</svg>