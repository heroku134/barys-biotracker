<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap');
      .font-sans { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .brand-title { font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: 16px; }
      .brand-sub { font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: 20px; }
      .model-tag { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 3px; }
    </style>

    <!-- PURE MINIMALIST FLAGSHIP EMBLEM: TWO BARS K-APEX -->
    <g id="kalkan-minimal-mark">
      <!-- Left Anchor Bar (Titanium Monolith, Defense, Stability) -->
      <rect x="0" y="0" width="34" height="260" rx="8" fill="#FFFFFF" />
      
      <!-- Right Minimal Chevron / Shield Apex (Speed, Direction, Letter K) -->
      <path d="M 160,8 L 74,130 L 160,252" fill="none" stroke="#00FFA3" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </defs>

  <!-- Deep Matte Obsidian Canvas -->
  <rect width="1600" height="500" fill="#060709" />

  <!-- BRAND IDENTITY GROUP -->
  <g transform="translate(180, 120)">
    
    <!-- 1. Ultra-Minimalist Icon (2 Bars: Monolith + Apex) -->
    <use href="#kalkan-minimal-mark" />

    <!-- 2. Primary Wordmark: КАЛКАН -->
    <text x="260" y="112" class="brand-title" font-size="108" fill="#FFFFFF">КАЛКАН</text>

    <!-- 3. Category Subtitle: СПОРТ -->
    <text x="266" y="174" class="brand-sub" font-size="32" fill="#00FFA3">СПОРТ</text>

    <!-- 4. Subtle Minimalist Hairline Divider -->
    <line x1="264" y1="202" x2="880" y2="202" stroke="#1E283A" stroke-width="2" />

    <!-- 5. Smartwatch Model Identifier: СААТ-1 -->
    <g transform="translate(264, 220)">
      <rect width="144" height="34" rx="8" fill="#0F141E" stroke="#00FFA3" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="18" y="22" class="model-tag" font-size="13" font-weight="700" fill="#00FFA3">СААТ-1</text>
      <text x="160" y="22" class="model-tag" font-size="11" font-weight="500" fill="#64748B">TITANIUM · 46MM</text>
    </g>
  </g>

  <!-- Technical Verification Watermark -->
  <text x="1420" y="470" class="font-mono" font-size="11" fill="#334155" text-anchor="end" letter-spacing="1">
    KALKAN SPORT · FLAGSHIP MINIMALIST VECTOR IDENTITY · 2026
  </text>
</svg>