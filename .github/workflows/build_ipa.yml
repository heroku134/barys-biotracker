name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Verify Flutter & Environment
        run: flutter doctor -v

      - name: 4. Install Dependencies
        run: flutter pub get

      - name: 5. Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: 6. Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 7. Build iOS App (Release, No CodeSign)
        run: flutter build ios --release --no-codesign

      - name: 8. Package into installable IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 KALKAN_SPORT.ipa Payload
          mv KALKAN_SPORT.ipa $GITHUB_WORKSPACE/
          cd $GITHUB_WORKSPACE
          ls -lh KALKAN_SPORT.ipa

      - name: 9. Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KALKAN_SPORT_iOS_IPA
          path: KALKAN_SPORT.ipa
          retention-days: 14

      - name: 10. Publish IPA to GitHub Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KALKAN_SPORT.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
