name: Build iOS IPA for AltStore / Sideloadly

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA on macOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Configure Flutter (Disable SPM, use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS application without code signing
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r barys_biotracker.ipa Payload
          ls -lh barys_biotracker.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barys_biotracker_ipa
          path: barys_biotracker.ipa
          retention-days: 14

      - name: Publish Release with IPA
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "CIRCA BioTracker v1.0.${{ github.run_number }} (iOS IPA)"
          body: |
            ### CIRCA ONE · Барыс-Батыр Биотрекер
            Готовый файл `.ipa` для установки через **AltStore** или **Sideloadly** на iPhone.
            - Перетащите `barys_biotracker.ipa` в Sideloadly или откройте в AltStore на телефоне.
          files: barys_biotracker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
